<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦆 DuckyBet - Scommesse & Giochi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Creepster&family=Nosifer&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; font-family:'Fredoka',sans-serif; }

  body {
    background: linear-gradient(135deg, #87CEEB 0%, #FFE55C 50%, #FFB347 100%);
    min-height: 100vh; color:#333; padding:20px; background-attachment: fixed;
  }

  body::before {
    content:''; position:fixed; inset:0;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.3) 0%, transparent 40%);
    pointer-events:none; z-index:0;
  }

  .container { position:relative; z-index:1; max-width:1100px; margin:0 auto; }

  /* ===== LOGIN ===== */
  .login-screen {
    position:fixed; inset:0;
    background: linear-gradient(135deg, #4A90E2, #87CEEB);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:20px;
  }
  .login-screen.hidden { display:none; }

  .login-box {
    background:#FFF9E6; border:5px solid #FFD93D; border-radius:30px;
    padding:40px 30px; text-align:center; max-width:420px; width:100%;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    animation: bounceIn 0.6s ease;
  }
  @keyframes bounceIn {
    0% { transform:scale(0.5); opacity:0; }
    60% { transform:scale(1.05); }
    100% { transform:scale(1); opacity:1; }
  }

  .login-duck {
    font-size:90px; display:block; margin-bottom:15px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-10px); }
  }

  .login-box h1 { color:#F5A623; font-size:32px; margin-bottom:10px; text-shadow:2px 2px 0 #FFD93D; }
  .login-box p { color:#666; margin-bottom:25px; font-size:14px; }

  .google-btn {
    background:#fff; color:#444; border:3px solid #ddd; border-radius:50px;
    padding:15px 25px; font-size:16px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%; transition:all 0.2s; font-family:'Fredoka',sans-serif;
  }
  .google-btn:hover { background:#f5f5f5; transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.15); }
  .google-btn:active { transform:translateY(0); }
  .google-icon { width:24px; height:24px; }

  /* ===== MODALE GOOGLE FINTA ===== */
  #googleModal {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
    z-index:2000; align-items:center; justify-content:center; padding:20px;
  }
  .gmodal-box {
    background:#fff; border-radius:20px; padding:35px 30px;
    max-width:400px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.4);
    animation: bounceIn 0.3s;
  }
  .gmodal-box h2 { font-family:Roboto,Arial,sans-serif; color:#202124; font-size:22px; margin-top:15px; text-align:center; }
  .gmodal-box .gsub { font-family:Roboto,Arial,sans-serif; color:#5f6368; font-size:14px; margin-top:8px; text-align:center; }
  .ginput {
    width:100%; padding:14px; border:1px solid #dadce0; border-radius:8px;
    font-size:15px; font-family:Roboto,Arial,sans-serif; margin-bottom:12px;
    box-sizing:border-box;
  }
  .ginput:focus { outline:none; border-color:#1a73e8; }
  .gbtn-cancel {
    background:none; border:none; color:#1a73e8; font-family:Roboto,Arial,sans-serif;
    font-weight:500; font-size:14px; cursor:pointer; padding:10px;
  }
  .gbtn-next {
    background:#1a73e8; color:#fff; border:none; padding:12px 26px;
    border-radius:8px; font-family:Roboto,Arial,sans-serif; font-weight:500;
    font-size:14px; cursor:pointer;
  }
  .gbtn-next:hover { background:#1557b0; }
  .gwarn { font-family:Roboto,Arial,sans-serif; color:#999; font-size:11px; text-align:center; margin-top:20px; }

  /* ===== HEADER ===== */
  header {
    background:#FFF9E6; border:5px solid #FFD93D; border-radius:25px;
    padding:20px; text-align:center; margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15); position:relative;
  }
  header h1 {
    color:#F5A623; font-size:38px; text-shadow:3px 3px 0 #FFD93D;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  header .subtitle { color:#888; font-size:14px; margin-top:5px; font-weight:600; }

  .user-info {
    position:absolute; top:15px; right:20px;
    display:flex; align-items:center; gap:10px;
    background:#FFD93D; padding:6px 14px; border-radius:30px;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .user-info:hover { background:#F5A623; color:#fff; }

  /* ===== BALANCE ===== */
  .balance-bar {
    display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:15px; margin-bottom:25px;
  }
  .balance-card {
    background:#FFF9E6; border:4px solid #FFD93D; border-radius:20px;
    padding:15px; text-align:center; box-shadow:0 6px 0 #E8B923;
    transition:transform 0.2s;
  }
  .balance-card:hover { transform:translateY(-3px); }
  .balance-card .icon { font-size:30px; display:block; margin-bottom:5px; }
  .balance-card .label { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
  .balance-card .value { font-size:22px; color:#F5A623; font-weight:700; margin-top:3px; }

  /* ===== TABS ===== */
  .tabs { display:flex; justify-content:center; gap:10px; margin-bottom:25px; flex-wrap:wrap; }
  .tab-btn {
    background:#FFF9E6; color:#F5A623; border:4px solid #FFD93D;
    border-radius:20px; padding:12px 22px; font-size:15px; font-weight:700;
    cursor:pointer; font-family:'Fredoka',sans-serif; transition:all 0.2s;
    box-shadow:0 5px 0 #E8B923;
  }
  .tab-btn:hover { transform:translateY(-2px); box-shadow:0 7px 0 #E8B923; }
  .tab-btn.active { background:#F5A623; color:#fff; border-color:#E8B923; box-shadow:0 5px 0 #B87A0F; }

  .tab-btn.halloween {
    background:#1a1a1a; color:#FF6B00; border-color:#FF6B00;
    box-shadow:0 5px 0 #8B2500;
  }
  .tab-btn.halloween:hover { box-shadow:0 7px 0 #8B2500; }
  .tab-btn.halloween.active {
    background:#FF6B00; color:#000; border-color:#FFD700;
    box-shadow:0 5px 0 #B87A0F;
  }

  /* ===== SECTIONS ===== */
  .section { display:none; }
  .section.active { display:block; animation:fadeIn 0.4s; }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(15px); }
    to { opacity:1; transform:translateY(0); }
  }

  .panel {
    background:#FFF9E6; border:5px solid #FFD93D; border-radius:25px;
    padding:25px; box-shadow:0 10px 30px rgba(0,0,0,0.15); margin-bottom:20px;
  }
  .panel h2 { color:#F5A623; font-size:24px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
  .panel .desc { color:#888; font-size:14px; margin-bottom:20px; font-weight:600; }

  /* ===== BUTTONS ===== */
  .btn {
    background:#F5A623; color:#fff; border:none; border-radius:15px;
    padding:13px 25px; font-size:16px; font-weight:700; cursor:pointer;
    font-family:'Fredoka',sans-serif; transition:all 0.15s;
    box-shadow:0 5px 0 #B87A0F; margin:4px;
  }
  .btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 7px 0 #B87A0F; }
  .btn:active:not(:disabled) { transform:translateY(3px); box-shadow:0 2px 0 #B87A0F; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn.green { background:#4CAF50; box-shadow:0 5px 0 #2E7D32; }
  .btn.green:hover:not(:disabled) { box-shadow:0 7px 0 #2E7D32; }
  .btn.blue { background:#4A90E2; box-shadow:0 5px 0 #2E5F9E; }
  .btn.blue:hover:not(:disabled) { box-shadow:0 7px 0 #2E5F9E; }
  .btn.red { background:#E74C3C; box-shadow:0 5px 0 #A93226; }
  .btn.purple { background:#9B59B6; box-shadow:0 5px 0 #6C3483; }

  /* ===== INPUT ===== */
  .bet-row { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin:15px 0; }
  .bet-input {
    background:#fff; color:#F5A623; border:4px solid #FFD93D; border-radius:15px;
    padding:12px; font-size:18px; font-weight:700; font-family:'Fredoka',sans-serif;
    width:130px; text-align:center;
  }
  .bet-input:focus { outline:none; border-color:#F5A623; }
  .bet-label { font-size:15px; color:#888; font-weight:700; }

  .quick-bets { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
  .quick-bet {
    background:#fff; color:#F5A623; border:3px solid #FFD93D; border-radius:12px;
    padding:6px 14px; font-size:13px; font-weight:700; cursor:pointer;
    font-family:'Fredoka',sans-serif; transition:all 0.15s;
  }
  .quick-bet:hover { background:#FFD93D; color:#fff; }

  /* ===== MESSAGE ===== */
  .message {
    font-size:17px; min-height:30px; margin:15px 0; color:#F5A623;
    font-weight:700; text-align:center; padding:12px; border-radius:15px; transition:all 0.3s;
  }
  .message.win { color:#2E7D32; background:#C8E6C9; animation:pop 0.5s; }
  .message.lose { color:#C0392B; background:#FFCDD2; }
  .message.info { color:#2E5F9E; background:#BBDEFB; }
  @keyframes pop {
    0% { transform:scale(0.8); }
    50% { transform:scale(1.1); }
    100% { transform:scale(1); }
  }

  /* ===== CALCIO ===== */
  .match-list { display:grid; gap:15px; }
  .match-card {
    background:#fff; border:3px solid #FFD93D; border-radius:18px;
    padding:18px; transition:all 0.2s;
  }
  .match-card:hover { border-color:#F5A623; }
  .match-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
  .league { font-size:12px; color:#888; font-weight:700; background:#FFF9E6; padding:4px 10px; border-radius:10px; }
  .match-time { font-size:12px; color:#F5A623; font-weight:700; }
  .teams {
    display:flex; justify-content:space-around; align-items:center;
    margin:15px 0; font-size:18px; font-weight:700; color:#333; gap:10px;
  }
  .team { flex:1; text-align:center; }
  .vs { color:#F5A623; font-size:20px; font-weight:700; padding:0 10px; }
  .odds { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
  .odd-btn {
    background:#FFF9E6; border:3px solid #FFD93D; border-radius:12px;
    padding:12px 8px; cursor:pointer; font-family:'Fredoka',sans-serif;
    font-weight:700; transition:all 0.15s; color:#333;
  }
  .odd-btn:hover { background:#FFD93D; color:#fff; transform:translateY(-2px); }
  .odd-btn.selected { background:#F5A623; color:#fff; border-color:#B87A0F; box-shadow:0 4px 0 #B87A0F; }
  .odd-label { display:block; font-size:11px; color:#888; margin-bottom:3px; }
  .odd-btn.selected .odd-label { color:#FFE9B0; }
  .odd-value { display:block; font-size:16px; }

  /* ===== CAVALLI ===== */
  .race-track {
    background:linear-gradient(to bottom, #8BC34A, #558B2F);
    border:5px solid #FFD93D; border-radius:20px; padding:15px;
    margin:20px 0; position:relative; overflow:hidden;
  }
  .lane {
    display:flex; align-items:center; height:50px; margin:6px 0;
    position:relative; background:rgba(255,255,255,0.2);
    border-radius:12px; padding-left:10px;
  }
  .lane-num {
    font-weight:700; color:#fff; background:#F5A623; width:28px; height:28px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:14px; margin-right:10px; z-index:2;
  }
  .horse {
    font-size:32px; position:absolute; transition:left 0.1s linear;
    left:50px; z-index:1;
    filter:drop-shadow(2px 2px 2px rgba(0,0,0,0.3));
  }
  .horse.winner { animation:hop 0.3s infinite; }
  @keyframes hop {
    0%,100% { transform:translateY(0) scale(1); }
    50% { transform:translateY(-8px) scale(1.1); }
  }
  .finish-line {
    position:absolute; right:15px; top:0; bottom:0; width:20px;
    background-image:repeating-linear-gradient(45deg, #000 0, #000 5px, #fff 5px, #fff 10px);
    border-radius:4px;
  }
  .horse-picker { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:10px; margin:15px 0; }
  .horse-option {
    background:#fff; border:3px solid #FFD93D; border-radius:15px;
    padding:12px; text-align:center; cursor:pointer; font-weight:700;
    transition:all 0.15s; font-family:'Fredoka',sans-serif;
  }
  .horse-option:hover { transform:translateY(-3px); border-color:#F5A623; }
  .horse-option.selected { background:#F5A623; color:#fff; border-color:#B87A0F; box-shadow:0 5px 0 #B87A0F; }
  .horse-option .h-emoji { font-size:28px; display:block; margin-bottom:4px; }
  .horse-option .h-name { font-size:12px; }
  .horse-option .h-odds { font-size:13px; margin-top:4px; color:#F5A623; }
  .horse-option.selected .h-odds { color:#FFE9B0; }

  /* ===== PAPERE ===== */
  .duck-area {
    background:linear-gradient(to bottom, #87CEEB 0%, #B3E5FC 60%, #4FC3F7 100%);
    border:5px solid #FFD93D; border-radius:20px; height:380px;
    position:relative; overflow:hidden; margin:20px 0;
    cursor:crosshair; user-select:none;
  }
  .cloud { position:absolute; font-size:40px; opacity:0.8; animation:cloudMove 20s linear infinite; }
  @keyframes cloudMove { from { left:-60px; } to { left:110%; } }
  .duck {
    position:absolute; font-size:50px; cursor:pointer;
    transition:transform 0.1s; user-select:none;
    filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.3)); z-index:3;
  }
  .duck:hover { transform:scale(1.15); }
  .duck.hit { animation:duckHit 0.4s forwards; pointer-events:none; }
  @keyframes duckHit {
    0% { transform:scale(1.3) rotate(0deg); }
    100% { transform:scale(0) rotate(360deg); opacity:0; }
  }
  .duck.golden {
    filter:drop-shadow(0 0 15px gold) drop-shadow(2px 3px 3px rgba(0,0,0,0.3));
    animation:goldenGlow 0.6s infinite alternate;
  }
  @keyframes goldenGlow {
    from { transform:scale(1); }
    to { transform:scale(1.1); }
  }
  .duck-stats {
    display:flex; justify-content:space-around; background:#FFF9E6;
    border:3px solid #FFD93D; border-radius:15px; padding:12px;
    margin-bottom:15px; flex-wrap:wrap; gap:10px;
  }
  .duck-stat { text-align:center; font-weight:700; }
  .duck-stat .s-label { font-size:11px; color:#888; text-transform:uppercase; }
  .duck-stat .s-value { font-size:20px; color:#F5A623; }

  .game-over-overlay {
    position:absolute; inset:0; background:rgba(0,0,0,0.75);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; border-radius:15px; z-index:10;
  }
  .game-over-overlay h3 { font-size:32px; color:#FFD93D; margin-bottom:15px; }
  .game-over-overlay p { font-size:20px; margin-bottom:20px; }

  /* ===== HALLOWEEN PAGE ===== */
  .halloween-page {
    background:#0a0a0a;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(255,107,0,0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(155,89,182,0.15) 0%, transparent 40%),
      linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
      repeating-linear-gradient(0deg, #1a1a1a 0px, #1a1a1a 2px, #000 2px, #000 4px);
    min-height: 100vh;
    position:fixed; inset:0; z-index:500;
    overflow-y:auto;
    padding:30px 20px;
    display:none;
  }
  .halloween-page.active { display:block; animation:fadeIn 0.5s; }

  .halloween-close {
    position:fixed; top:20px; right:20px; z-index:600;
    background:#FF6B00; color:#000; border:3px solid #FFD700;
    border-radius:50%; width:50px; height:50px;
    font-size:24px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 20px #FF6B00;
  }
  .halloween-close:hover { background:#FFD700; }

  .halloween-content {
    max-width:800px; margin:0 auto; text-align:center;
    position:relative; z-index:2;
  }

  .halloween-title {
    font-family:'Creepster', cursive;
    font-size: 70px; color:#FF6B00;
    text-shadow: 0 0 20px #FF6B00, 0 0 40px #FF0000, 4px 4px 0 #8B2500;
    margin-bottom:10px; letter-spacing:5px;
    animation: flicker 3s infinite alternate;
  }
  @keyframes flicker {
    0%,100% { opacity:1; }
    92% { opacity:1; }
    93% { opacity:0.3; }
    94% { opacity:1; }
    96% { opacity:0.4; }
    97% { opacity:1; }
  }

  .halloween-sub {
    font-family:'Creepster', cursive;
    font-size:28px; color:#9B59B6;
    text-shadow: 0 0 15px #9B59B6;
    margin-bottom:40px;
    letter-spacing:3px;
  }

  .pfp-container {
    margin: 30px auto 25px;
    position:relative;
    width:200px; height:200px;
    display:flex; align-items:center; justify-content:center;
  }

  .pfp-ring {
    position:absolute; inset:-15px;
    border-radius:50%;
    background: conic-gradient(#FF6B00, #FFD700, #9B59B6, #FF6B00);
    animation: rotate 4s linear infinite;
    filter: blur(2px);
  }
  @keyframes rotate {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }

  .pfp-image {
    width:200px; height:200px; border-radius:50%;
    border:5px solid #000; object-fit:cover;
    position:relative; z-index:2;
    background:#1a1a1a;
    box-shadow: 0 0 30px #FF6B00;
  }

  .pfp-fallback {
    width:200px; height:200px; border-radius:50%;
    border:5px solid #000; background:#1a1a1a;
    display:flex; align-items:center; justify-content:center;
    font-size:100px; position:relative; z-index:2;
    box-shadow: 0 0 30px #FF6B00;
  }

  .creator-name {
    font-family:'Creepster', cursive;
    font-size:48px; color:#FFD700;
    text-shadow: 0 0 20px #FFD700, 0 0 40px #FF6B00;
    margin: 20px 0 10px;
    letter-spacing:4px;
  }

  .creator-role {
    font-size:18px; color:#9B59B6;
    font-weight:700; letter-spacing:2px;
    text-transform:uppercase; margin-bottom:30px;
  }

  .halloween-card {
    background: rgba(26,26,26,0.85);
    border: 3px solid #FF6B00;
    border-radius: 20px;
    padding: 30px;
    margin: 20px 0;
    box-shadow: 0 0 30px rgba(255,107,0,0.4), inset 0 0 30px rgba(255,107,0,0.1);
    backdrop-filter: blur(5px);
  }

  .halloween-card h3 {
    font-family:'Creepster', cursive;
    font-size:32px; color:#FF6B00;
    text-shadow: 0 0 15px #FF6B00;
    margin-bottom:15px;
    letter-spacing:3px;
  }

  .halloween-card p {
    font-size:16px; color:#ddd;
    line-height:1.8; margin-bottom:10px;
  }

  .halloween-card .highlight { color:#FFD700; font-weight:700; }
  .halloween-card .purple { color:#9B59B6; font-weight:700; }

  .pumpkin-row {
    display:flex; justify-content:center; gap:20px;
    margin: 20px 0; flex-wrap:wrap;
  }

  .pumpkin {
    font-size:50px;
    animation: pumpkinBounce 2s ease-in-out infinite;
    display:inline-block;
  }
  .pumpkin:nth-child(2) { animation-delay:0.3s; }
  .pumpkin:nth-child(3) { animation-delay:0.6s; }
  .pumpkin:nth-child(4) { animation-delay:0.9s; }
  .pumpkin:nth-child(5) { animation-delay:1.2s; }
  @keyframes pumpkinBounce {
    0%,100% { transform:translateY(0) rotate(-5deg); }
    50% { transform:translateY(-15px) rotate(5deg); }
  }

  .project-list {
    display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
    gap:15px; margin-top:20px;
  }

  .project-item {
    background: rgba(0,0,0,0.6);
    border: 2px solid #9B59B6;
    border-radius: 15px;
    padding: 15px;
    transition: all 0.3s;
  }
  .project-item:hover {
    border-color: #FF6B00;
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(255,107,0,0.3);
  }
  .project-item .p-icon { font-size:32px; display:block; margin-bottom:8px; }
  .project-item .p-name { color:#FFD700; font-weight:700; margin-bottom:5px; font-size:14px; }
  .project-item .p-desc { color:#aaa; font-size:12px; line-height:1.5; }

  /* ===== BET SLIP ===== */
  .betslip {
    position:fixed; bottom:20px; right:20px;
